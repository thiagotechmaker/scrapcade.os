# ScrapCade OS: o som sai pelas caixas e pelo fone, nao pelo HDMI. Notebook com saida HDMI escolhia o HDMI
# (sem monitor com som ligado nele) e ficava mudo. O HDMI continua disponivel, so com prioridade menor.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
    actions = { update-props = { priority.session = 300, priority.driver = 300 } }
  }
]

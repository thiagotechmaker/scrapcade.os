# ScrapCade: a SCRAP-DADOS aparece na rede do Windows como \\ScrapCade\jogos (rede de casa, sem senha)
[global]
   workgroup = WORKGROUP
   netbios name = ScrapCade
   server string = ScrapCade
   server role = standalone server
   map to guest = Bad User
   guest account = root
   load printers = no
   disable spoolss = yes
   log file = /userdata/system/logs/samba.log
   max log size = 200
   hosts allow = 10. 172.16. 192.168. 127.
[jogos]
   path = /userdata
   browseable = yes
   writable = yes
   guest ok = yes
   force user = root

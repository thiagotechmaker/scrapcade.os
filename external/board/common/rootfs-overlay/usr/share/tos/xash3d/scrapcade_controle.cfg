// ScrapCade OS: botoes do Half-Life iguais aos do fliperama do iChroma (o tos-jogar executa este arquivo)
// analogico esquerdo anda, direito mira; RT atira, LT tiro secundario; A pula, B agacha; Y usa, X recarrega;
// LB e RB trocam de arma; Select lanterna; Start menu
bind "RTRIGGER" "+attack"
bind "R2_BUTTON" "+attack"
bind "LTRIGGER" "+attack2"
bind "L2_BUTTON" "+attack2"
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "Y_BUTTON" "+use"
bind "X_BUTTON" "+reload"
bind "L1_BUTTON" "invprev;wait;+attack;wait;wait;-attack"
bind "R1_BUTTON" "invnext;wait;+attack;wait;wait;-attack"
bind "BACK" "impulse 100"
bind "START" "togglemenu"
bind "STICK1" "+speed"
bind "DPAD_DOWN" "lastinv"

# ScrapCade: configuracao central do RetroArch. O tos-jogar copia este arquivo a cada jogo:
# resolucao, som, controles e atalhos sao os mesmos em todo emulador.
# Para mudar algo so seu, use /userdata/system/configs/retroarch/retroarch-usuario.cfg

# video: direto na placa (KMS), sem X
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_font_enable = "true"
aspect_ratio_index = "22"

# som
audio_driver = "alsa"
audio_latency = "64"

# menu em portugues, simples (RGUI, embutido)
menu_driver = "rgui"
user_language = "7"
rgui_show_start_screen = "false"
# cores do ScrapCade no menu do RetroArch (tema Aurora)
rgui_menu_color_theme = "0"
rgui_menu_theme_preset = "/usr/share/tos/rgui-scrapcade.cfg"
rgui_particle_effect = "0"
menu_show_core_updater = "false"
menu_show_online_updater = "false"

# pastas na particao SCRAP-DADOS
system_directory = "/userdata/bios"
screenshot_directory = "/userdata/screenshots"
libretro_directory = "/usr/lib/libretro"

# nunca perder o progresso: salva ao sair e continua de onde parou
savestate_auto_save = "true"
savestate_auto_load = "true"
# foto do ponto salvo: o "Continuar jogando" do ScrapCade mostra onde voce parou
savestate_thumbnail_enable = "true"
config_save_on_exit = "false"
quit_press_twice = "false"
pause_nonactive = "false"

# controles: banco de dados de controles do SDL2 (Xbox, PlayStation, Nintendo, genericos)
input_driver = "udev"
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"
input_max_users = "4"

# atalhos iguais em todo jogo: Select + Start sai, Select + X abre o menu,
# Select + RB salva, Select + LB carrega. No teclado: Esc sai, F1 abre o menu.
input_enable_hotkey_btn = "4"
input_exit_emulator_btn = "6"
input_menu_toggle_btn = "2"
input_save_state_btn = "10"
input_load_state_btn = "9"
input_screenshot_btn = "3"
input_screenshot = "f8"
# pacote completo de filtros (glsl-shaders) no menu do jogo
video_shader_dir = "/usr/share/retroarch/shaders/glsl"
netplay_nickname = "ScrapCade"
input_enable_hotkey = "nul"
input_exit_emulator = "escape"
input_menu_toggle = "f1"


# ScrapCade: menu de boot para BIOS antigo (syslinux/isolinux, vesamenu)
DEFAULT tos
UI vesamenu.c32
PROMPT 0
TIMEOUT 50
MENU TITLE Bem-vindo ao ScrapCade OS @VERSAO@
MENU BACKGROUND fundo.png
MENU RESOLUTION 640 480
MENU WIDTH 50
MENU MARGIN 3
MENU HSHIFT 15
MENU ROWS 6
MENU VSHIFT 10
MENU TABMSGROW 21
MENU TIMEOUTROW 23
MENU TABMSG Aperte [Tab] para editar os parƒmetros
MENU AUTOBOOT Iniciando em # segundo{,s}...
MENU COLOR screen      37;40   #00000000 #00000000 none
MENU COLOR border      30;44   #6032e6a8 #d0101428 std
MENU COLOR title       1;36;44 #ffffffff #d0101428 std
MENU COLOR sel         7;37;40 #ff0b0520 #ff32e6a8 all
MENU COLOR unsel       37;44   #ffe6e9f0 #d0101428 std
MENU COLOR hotsel      1;7;37;40 #ff0b0520 #ff32e6a8 all
MENU COLOR hotkey      1;37;44 #ffffffff #d0101428 std
MENU COLOR tabmsg      31;40   #ffc8cde6 #00000000 std
MENU COLOR timeout_msg 37;40   #ffc8cde6 #00000000 std
MENU COLOR timeout     1;37;40 #ffffffff #00000000 std
MENU COLOR help        37;40   #ffc8cde6 #00000000 std

LABEL tos
  MENU LABEL Iniciar o ScrapCade OS
  KERNEL /boot/bzImage
  INITRD /boot/initrd.gz
  APPEND console=tty1 quiet loglevel=3 fbcon=logo-pos:center fbcon=logo-count:1 vt.global_cursor_default=0 vga=0x314

LABEL compat
  MENU LABEL Iniciar em modo de compatibilidade
  KERNEL /boot/bzImage
  INITRD /boot/initrd.gz
  APPEND console=tty1 quiet loglevel=3 tos.seguro=1 fbcon=logo-pos:center fbcon=logo-count:1 vt.global_cursor_default=0 vga=0x314
  TEXT HELP
  Desenha sem usar o 3D da placa de v¡deo. Use se a tela ficar preta.
  ENDTEXT

LABEL texto
  MENU LABEL Iniciar mostrando as mensagens
  KERNEL /boot/bzImage
  INITRD /boot/initrd.gz
  APPEND console=tty1 loglevel=7

LABEL anterior
  MENU LABEL Sistema anterior do ScrapCade OS
  KERNEL /boot/bzImage-anterior
  INITRD /boot/initrd-anterior.gz
  APPEND console=tty1 quiet loglevel=3 tos.sistema=tos-anterior.squashfs fbcon=logo-pos:center fbcon=logo-count:1 vt.global_cursor_default=0 vga=0x314
  TEXT HELP
  Liga a versao de antes da £ltima atualiza‡ao. S¢ existe depois de atualizar.
  ENDTEXT

LABEL memtest
  MENU LABEL Teste de mem¢ria
  LINUX /boot/memtest.bin

LABEL disco
  MENU LABEL Ligar pelo disco do computador
  COM32 chain.c32
  APPEND hd1

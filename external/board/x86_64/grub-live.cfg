set default="0"
set timeout="5"
set menu_color_normal=white/black
set menu_color_highlight=black/cyan
# BIOS: liga o kernel ja em modo grafico, para a logo do ScrapCade OS aparecer no lugar do texto
if [ "$grub_platform" = "pc" ]; then
	set gfxpayload=1024x768,800x600,auto
fi
# Liga o sistema do MESMO disco de onde o GRUB veio (o pen drive escolhido na BIOS/UEFI); so procura em outro
# disco se nesse nao houver. O UUID da particao vai para o initrd (tos.uuid=), que monta exatamente ela.
if [ -f /boot/tos-live ]; then
	true
else
	regexp --set=1:disco '^\(([^,)]+)' "$cmdpath"
	if [ -n "$disco" ]; then
		if [ -f ($disco)/boot/tos-live ]; then set root=($disco)
		elif [ -f ($disco,msdos1)/boot/tos-live ]; then set root=($disco,msdos1)
		elif [ -f ($disco,gpt1)/boot/tos-live ]; then set root=($disco,gpt1)
		fi
	fi
	if [ ! -f /boot/tos-live ]; then search --no-floppy --set=root --file /boot/tos-live; fi
fi
probe --set=tosuuid --fs-uuid $root
# instalado no computador (tos-instalar): liga direto na logo; segurando Esc ou Shift ao ligar, o menu aparece.
# No pen drive o menu aparece sempre (e a midia de instalacao).
if [ -f /boot/tos-instalado ]; then
	set timeout_style=hidden
	set timeout=1
fi
# instalado ao lado do Windows: menu de 3 s com os dois sistemas, ja no ultimo que foi usado
set tosroot=$root
if [ -f /boot/tos-dualboot ]; then
	set timeout_style=menu
	set timeout=3
	set default=scrapcade
	load_env --file ($tosroot)/boot/grub/grubenv saved_entry
	if [ -n "$saved_entry" ]; then set default="$saved_entry"; fi
fi

menuentry "Iniciar o ScrapCade OS" --id scrapcade {
	if [ -f ($tosroot)/boot/tos-dualboot ]; then set saved_entry=scrapcade; save_env --file ($tosroot)/boot/grub/grubenv saved_entry; fi
	linux /boot/bzImage console=tty1 tos.uuid=$tosuuid quiet loglevel=3 fbcon=logo-pos:center fbcon=logo-count:1 vt.global_cursor_default=0
	initrd /boot/initrd.gz
}
if [ -f /boot/tos-dualboot ]; then
	if [ "$grub_platform" = "efi" ]; then
		menuentry "Windows" --id windows {
			set saved_entry=windows
			save_env --file ($tosroot)/boot/grub/grubenv saved_entry
			search --no-floppy --set=root --file /EFI/Microsoft/Boot/bootmgfw.efi
			chainloader /EFI/Microsoft/Boot/bootmgfw.efi
		}
	else
		menuentry "Windows" --id windows {
			set saved_entry=windows
			save_env --file ($tosroot)/boot/grub/grubenv saved_entry
			search --no-floppy --set=root --file /bootmgr
			ntldr /bootmgr
		}
	fi
fi
menuentry "Iniciar em modo de compatibilidade (sem aceleracao de video)" {
	linux /boot/bzImage console=tty1 tos.uuid=$tosuuid quiet loglevel=3 tos.seguro=1 fbcon=logo-pos:center fbcon=logo-count:1 vt.global_cursor_default=0
	initrd /boot/initrd.gz
}
menuentry "Iniciar mostrando as mensagens" {
	linux /boot/bzImage console=tty1 tos.uuid=$tosuuid loglevel=7
	initrd /boot/initrd.gz
}
if [ -f /boot/tos-anterior.squashfs ]; then
menuentry "Versao anterior do ScrapCade OS" {
	linux /boot/bzImage-anterior console=tty1 tos.uuid=$tosuuid quiet loglevel=3 tos.sistema=tos-anterior.squashfs fbcon=logo-pos:center fbcon=logo-count:1 vt.global_cursor_default=0
	initrd /boot/initrd-anterior.gz
}
fi
if [ "$grub_platform" = "efi" ]; then
menuentry "Teste de memoria" {
	chainloader /boot/memtest.efi
}
else
menuentry "Teste de memoria" {
	linux16 /boot/memtest.bin
}
fi
menuentry "Ligar pelo disco do computador" {
	exit
}

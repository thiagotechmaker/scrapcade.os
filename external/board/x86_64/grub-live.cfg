set default="0"
set timeout="5"
set menu_color_normal=white/black
set menu_color_highlight=black/cyan
search --no-floppy --set=root --file /boot/tos-live

menuentry "Iniciar o ScrapCade" {
	linux /boot/bzImage console=tty1 quiet loglevel=3
	initrd /boot/initrd.gz
}
menuentry "Iniciar em modo de compatibilidade (sem aceleracao de video)" {
	linux /boot/bzImage console=tty1 quiet loglevel=3 tos.seguro=1
	initrd /boot/initrd.gz
}
menuentry "Iniciar mostrando as mensagens" {
	linux /boot/bzImage console=tty1 loglevel=7
	initrd /boot/initrd.gz
}
if [ -f /boot/tos-anterior.squashfs ]; then
menuentry "Versao anterior do ScrapCade" {
	linux /boot/bzImage-anterior console=tty1 quiet loglevel=3 tos.sistema=tos-anterior.squashfs
	initrd /boot/initrd-anterior.gz
}
fi
if [ "$grub_platform" = "efi" ]; then
menuentry "Teste de memoria" {
	chainloader /boot/memtest.efi
}
else
menuentry "Teste de memoria" {
	linux16 /boot/memtest.bin
}
fi
menuentry "Ligar pelo disco do computador" {
	exit
}

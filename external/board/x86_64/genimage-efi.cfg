# T-OS: tabela MBR para ligar tanto por UEFI quanto por BIOS antigo.
# Setor 0: codigo do GRUB (sem mexer na tabela); setores 1 em diante: nucleo do GRUB para BIOS.
# Particao TOS-BOOT (FAT32, tipo EFI) com GRUB UEFI, kernel, initrd e o sistema (tos.squashfs).
# A particao de dados TOS-DADOS e criada no primeiro boot, no espaco livre do disco.
image boot.vfat {
	vfat {
		label = "TOS-BOOT"
		file EFI {
			image = "efi-part/EFI"
		}
		file boot/bzImage {
			image = "bzImage"
		}
		file boot/initrd.gz {
			image = "tos-initrd.gz"
		}
		file boot/tos.squashfs {
			image = "rootfs.squashfs"
		}
		file boot/tos-live {
			image = "tos-live"
		}
	}
	size = 1G
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
	}
	partition mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}
	partition grub {
		in-partition-table = "no"
		image = "tos-core.img"
		offset = 512
	}
	partition boot {
		image = "boot.vfat"
		partition-type = 0xEF
		offset = 1M
		bootable = true
	}
}

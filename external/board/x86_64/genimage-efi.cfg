# ScrapCade: tabela MBR para ligar tanto por UEFI (GRUB em EFI/BOOT) quanto por BIOS antigo
# (mbr.bin do syslinux no setor 0 e o syslinux na particao, com o menu de boot com fundo).
# A particao de dados TOS-DADOS e criada no primeiro boot, no espaco livre do disco.
image boot.vfat {
	vfat {
		label = "TOS-BOOT"
		file EFI {
			image = "efi-part/EFI"
		}
		file syslinux {
			image = "tos-syslinux"
		}
		file boot/bzImage {
			image = "bzImage"
		}
		file boot/initrd.gz {
			image = "tos-initrd.gz"
		}
		file boot/tos.squashfs {
			image = "rootfs.squashfs"
		}
		file boot/memtest.bin {
			image = "tos-memtest.bin"
		}
		file boot/memtest.efi {
			image = "tos-memtest.efi"
		}
		file boot/tos-live {
			image = "tos-live"
		}
	}
	size = 1G
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
	}
	partition boot {
		image = "boot.vfat"
		partition-type = 0xEF
		offset = 1M
		bootable = true
	}
}

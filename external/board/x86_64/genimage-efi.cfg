# T-OS: particao TOS-BOOT (FAT32) com GRUB, kernel, initrd e o sistema (tos.squashfs).
# A particao de dados TOS-DADOS e criada no primeiro boot, no espaco livre do disco.
image boot.vfat {
	vfat {
		label = "TOS-BOOT"
		file EFI {
			image = "efi-part/EFI"
		}
		file boot/bzImage {
			image = "bzImage"
		}
		file boot/initrd.gz {
			image = "tos-initrd.gz"
		}
		file boot/tos.squashfs {
			image = "rootfs.squashfs"
		}
		file boot/tos-live {
			image = "tos-live"
		}
	}
	size = 1G
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition boot {
		image = "boot.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}
}

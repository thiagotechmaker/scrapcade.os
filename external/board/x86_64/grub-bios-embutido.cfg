# GRUB pela BIOS (este arquivo roda no modo de resgate do GRUB: so comandos simples, sem if).
# O disco da BIOS (hd0) e o pen drive/disco de onde ligou: --hint faz o search olhar nele primeiro.
search --no-floppy --set=root --file /boot/tos-live --hint=hd0,msdos1 --hint=hd0
set prefix=($root)/EFI/BOOT
configfile ($root)/EFI/BOOT/grub.cfg
